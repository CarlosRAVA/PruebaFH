# --- Configuración del DataSource personalizado ---
spring.application.name=pago.servicios
server.port=8081

#spring.datasource.driver.class=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/gestopago
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Indica que si no encuentra el servidor de configuración, igual levante la app
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA / Hibernate (Limpio sin warning de dialecto)
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
@@ -35,6 +29,23 @@ spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Base de datos NoSQL (MongoDB local)
spring.data.mongodb.uri=mongodb://localhost:27017/pago_servicios

