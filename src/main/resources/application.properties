# --- Configuración del DataSource personalizado ---
spring.datasource.driver.class=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/gestopago
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=none

# Indica que si no encuentra el servidor de configuración, igual levante la app
spring.config.import=optional:configserver:

# Flyway (gestionado manualmente via FlywayConfig)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# GestoPago
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
# Intervalo de renovación del token en ms (3600000 = 1 hora)
gestopago.auth.refresh-rate-ms=3600000

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# (Opcional) logging
logging.level.root=INFO
logging.level.com.tu.paquete=DEBUG
# Informaci�n general del API
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
server.port=8081
# URL base del servidor (localhost)
openapi.url.dev=http://localhost:8081
openapi.description.dev=Local Development Server